name: Build Vivid APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    # 30 min se quedaba justo ahora que el job también corre lintVitalRelease.
    timeout-minutes: 40

    env:
      # Refuerza la memoria aunque Gradle no alcance a leer gradle.properties.
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

      # URL pública del Cloudflare Worker (push + broker de Backblaze B2).
      # Settings → Secrets and variables → Actions → Variables.
      VIVID_WORKER_URL: ${{ vars.VIVID_WORKER_URL || vars.VIVID_PUSH_WORKER_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test google-services.json validator
        shell: bash
        run: python3 scripts/test_validate_google_services.py

      - name: Validate Worker URL
        shell: bash
        run: |
          if [ -z "$VIVID_WORKER_URL" ]; then
            echo "::warning::No está configurada la variable VIVID_WORKER_URL."
            echo "::warning::El APK compilará, pero fallará al subir o ver archivos."
          elif [[ "$VIVID_WORKER_URL" != https://* ]]; then
            echo "::error::VIVID_WORKER_URL debe comenzar con https://"
            exit 1
          else
            echo "Cloudflare Worker configurado correctamente."
          fi

      # google-services.json ya NO está versionado: se inyecta desde el
      # secret GOOGLE_SERVICES_JSON_BASE64. Sin él, el release NO compila
      # a propósito (un APK de producción no debe llevar credenciales falsas).
      - name: Restore google-services.json
        shell: bash
        run: |
          SECRET="${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}"
          if [ -z "$SECRET" ]; then
            echo "::error::Falta el Repository Secret GOOGLE_SERVICES_JSON_BASE64."
            echo "::error::Crea el secret con:"
            echo "::error::  base64 -w0 vivid-app/app/google-services.json"
            exit 1
          fi
          printf '%s' "$SECRET" | base64 --decode > vivid-app/app/google-services.json
          python3 -c 'import json; json.load(open("vivid-app/app/google-services.json"))' || {
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 no es un JSON válido."
            exit 1
          }
          echo "google-services.json restaurado desde el secret."

      - name: Validate google-services.json for Google Sign-In
        shell: bash
        run: python3 scripts/validate-google-services.py vivid-app/app/google-services.json

      - name: Setup JDK 17
        # v5: v4 está deprecado y GitHub ya lo avisa en cada run.
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # API 36: compileSdk/targetSdk del proyecto (AGP 8.13 + Gradle 8.13).
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: vivid-app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

          ./gradlew clean assembleDebug \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vivid-debug-apk
          path: vivid-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Lint vuelve a estar activo en release (abortOnError = true).
      # Se ejecuta aquí, en cada PR, exactamente el mismo análisis que corre
      # dentro de assembleRelease/bundleRelease, para que un error de lint se
      # vea en la PR y no el día que hay que publicar.
      - name: Lint (mismo análisis que el release)
        working-directory: vivid-app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew lintVitalRelease \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-debug
          path: |
            vivid-app/app/build/reports/lint-results-*.html
            vivid-app/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14
