# ═══════════════════════════════════════════════════════════════════
#  Build iOS .ipa SIN FIRMA — para distribución con SideStore
# ═══════════════════════════════════════════════════════════════════

name: Build iOS .ipa (unsigned, for SideStore)

on:
  push:
    branches: [main]
    paths:
      - 'vivid-app/iosApp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned .ipa
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # Xcode 16 necesario: XcodeGen genera formato 77 (Xcode 16+)
          echo "Versiones de Xcode disponibles:"
          ls /Applications/ | grep -i xcode || true
          # Usar la versión más reciente de Xcode disponible
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            echo "::error::No se encontro Xcode 16 en el runner"
            exit 1
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Restore GoogleService-Info.plist
        run: |
          SECRET="${{ secrets.IOS_GOOGLE_SERVICE_PLIST }}"
          if [ -z "$SECRET" ]; then
            echo "::warning::IOS_GOOGLE_SERVICE_PLIST no configurado."
            cat > vivid-app/iosApp/iosApp/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>PROJECT_ID</key>
              <string>vivid-placeholder</string>
              <key>BUNDLE_ID</key>
              <string>com.vivid.app</string>
          </dict>
          </plist>
          PLIST
            exit 0
          fi
          printf '%s' "$SECRET" | base64 --decode > vivid-app/iosApp/iosApp/GoogleService-Info.plist
          echo "GoogleService-Info.plist restaurado."

      - name: Generate Xcode project
        working-directory: vivid-app/iosApp
        run: |
          xcodegen generate
          echo "Proyecto Xcode generado."
          ls -la *.xcodeproj/

      - name: Install CocoaPods dependencies
        working-directory: vivid-app/iosApp
        run: |
          gem install cocoapods --no-document
          pod install --repo-update
          echo "Workspace generado con pods."
          ls -la *.xcworkspace/

      - name: Build unsigned .app
        working-directory: vivid-app/iosApp
        run: |
          xcodebuild build \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Build fallo."
            xcodebuild build \
              -workspace iosApp.xcworkspace \
              -scheme iosApp \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tail -100
            exit 1
          fi
          echo "Build compilado sin firma."

      - name: Package as .ipa
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData" \
            -name "*.app" \
            -path "*/Build/Products/Release-iphoneos/*" \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No se encontro el .app compilado."
            find "$RUNNER_TEMP/DerivedData" -name "*.app" -print || true
            find "$RUNNER_TEMP/DerivedData/Build/Products" -type f -maxdepth 3 -print || true
            exit 1
          fi

          echo "App encontrada: $APP_PATH"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          mkdir -p release-artifacts
          IPA_NAME="Vivid-build${GITHUB_RUN_NUMBER}.ipa"
          (cd "$RUNNER_TEMP" && zip -r "$GITHUB_WORKSPACE/release-artifacts/$IPA_NAME" Payload/)

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo ".ipa creado: release-artifacts/$IPA_NAME"

      - name: Show bundle info
        run: |
          echo "=== Bundle info ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo "Bundle ID: com.vivid.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo "Version: 2.4.0"
          echo ""
          echo "Tamano del .ipa:"
          du -h "release-artifacts/$IPA_NAME"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivid-ios-unsigned-${{ github.run_number }}
          path: release-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          echo ""
          echo "=== Build completado ==="
          echo "Descarga el .ipa desde: Actions -> Artifacts"
          echo "Instala con SideStore en tu iPhone"
