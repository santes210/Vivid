name: Build Signed Release APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo permite leer el repositorio.
# El APK se descarga desde los artefactos de GitHub Actions.
permissions:
  contents: read

jobs:
  release:
    name: Build signed release APK + AAB (Play)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

      # URL pública del Cloudflare Worker (push + broker de Backblaze B2).
      VIVID_WORKER_URL: ${{ vars.VIVID_WORKER_URL || vars.VIVID_PUSH_WORKER_URL }}

      # Gradle utiliza estas variables para firmar el APK.
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/vivid-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VIVID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.VIVID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.VIVID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Worker URL
        shell: bash
        run: |
          if [ -z "$VIVID_WORKER_URL" ]; then
            echo "::error::Falta la Repository Variable VIVID_WORKER_URL."
            echo "::error::Sin ella el APK no puede subir ni mostrar archivos."
            exit 1
          fi

          if [[ "$VIVID_WORKER_URL" != https://* ]]; then
            echo "::error::VIVID_WORKER_URL debe comenzar con https://"
            exit 1
          fi

          if [[ "$VIVID_WORKER_URL" == */notify || "$VIVID_WORKER_URL" == */storage/* ]]; then
            echo "::error::VIVID_WORKER_URL debe ser solo la URL base del Worker."
            exit 1
          fi

          echo "Cloudflare Worker configurado correctamente."

            # google-services.json ya NO está versionado: se inyecta desde el
      # secret GOOGLE_SERVICES_JSON_BASE64. Sin él, el release NO compila
      # a propósito (un APK de producción no debe llevar credenciales falsas).
      - name: Restore google-services.json
        shell: bash
        run: |
          SECRET="${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}"
          if [ -z "$SECRET" ]; then
            echo "::error::Falta el Repository Secret GOOGLE_SERVICES_JSON_BASE64."
            echo "::error::Crea el secret con:"
            echo "::error::  base64 -w0 vivid-app/app/google-services.json"
            exit 1
          fi
          printf '%s' "$SECRET" | base64 --decode > vivid-app/app/google-services.json
          python3 -c 'import json; json.load(open("vivid-app/app/google-services.json"))' || {
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 no es un JSON válido."
            exit 1
          }
          echo "google-services.json restaurado desde el secret."

      - name: Guard packed music is compressed
        shell: bash
        run: |
          MUSIC_DIR="vivid-app/app/src/main/assets/music"
          if [ ! -d "$MUSIC_DIR" ]; then
            echo "::warning::No existe $MUSIC_DIR"
            exit 0
          fi

          WAVS="$(find "$MUSIC_DIR" -type f -iname '*.wav' -print || true)"
          if [ -n "$WAVS" ]; then
            echo "::error::Hay WAV sin comprimir en assets/music (inflan el APK):"
            echo "$WAVS"
            exit 1
          fi

          echo "Pistas empaquetadas:"
          find "$MUSIC_DIR" -type f \( -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.m4a' -o -iname '*.aac' \) | sort

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          # API 36: compileSdk/targetSdk del proyecto (obligatorio en Google Play
          # para toda actualización a partir del 31 de agosto de 2026).
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          VIVID_KEYSTORE_BASE64: ${{ secrets.VIVID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VIVID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Faltan los secrets de firma:"
            echo "::error::VIVID_KEYSTORE_BASE64"
            echo "::error::VIVID_KEYSTORE_PASSWORD"
            echo "::error::VIVID_KEY_ALIAS"
            echo "::error::VIVID_KEY_PASSWORD"
            exit 1
          fi

          printf '%s' "$VIVID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$ANDROID_KEYSTORE_PATH"

          if [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::error::El keystore decodificado está vacío."
            exit 1
          fi

          # Verifica el archivo, la contraseña y el alias.
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

      - name: Run unit tests
        working-directory: vivid-app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Build signed release APK + AAB
        working-directory: vivid-app
        shell: bash
        run: |
          chmod +x gradlew

          # isMinifyEnabled=true + isShrinkResources=true en el buildType release.
          # bundleRelease genera el .aab: es el ÚNICO formato que Google Play
          # acepta para publicar. El APK se sigue generando para instalación
          # directa / pruebas fuera de Play.
          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-release-vc${{ github.run_number }}
          path: |
            vivid-app/app/build/reports/lint-results-*.html
            vivid-app/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify R8 minify ran
        shell: bash
        run: |
          MAPPING="vivid-app/app/build/outputs/mapping/release/mapping.txt"
          if [ ! -s "$MAPPING" ]; then
            echo "::error::No se generó mapping.txt. R8 no minificó el release."
            echo "::error::Revisa isMinifyEnabled en app/build.gradle.kts."
            find vivid-app/app/build/outputs -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "R8 mapping.txt ($(wc -c < "$MAPPING") bytes):"
          ls -lh "$MAPPING"

      - name: Verify APK signature
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find vivid-app/app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            ! -name '*unsigned*' \
            -print \
            -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No se generó un APK release firmado."

            find vivid-app/app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

          mkdir -p release-artifacts

          OUTPUT_APK="release-artifacts/Vivid-${GITHUB_RUN_NUMBER}-release.apk"
          cp "$APK_PATH" "$OUTPUT_APK"

          echo "apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          echo "apk_bytes=$(wc -c < "$OUTPUT_APK")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUTPUT_APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: vivid-signed-release-vc${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # ── Android App Bundle (lo que se sube a Google Play) ────────────────
      - name: Verify AAB signature
        id: aab
        shell: bash
        run: |
          AAB_PATH="$(find vivid-app/app/build/outputs/bundle/release \
            -maxdepth 1 \
            -type f \
            -name '*.aab' \
            -print \
            -quit)"

          if [ -z "$AAB_PATH" ]; then
            echo "::error::No se generó el App Bundle (.aab) de release."
            echo "::error::Google Play solo acepta AAB: revisa la tarea bundleRelease."

            find vivid-app/app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1
          fi

          # El AAB se firma con el esquema JAR (v1): apksigner no lo valida,
          # jarsigner sí. Si el bundle saliera sin firmar, esto falla aquí y no
          # en la consola de Play.
          #
          # Sin -strict a propósito: con un certificado autofirmado (lo normal
          # en un keystore de app) -strict devuelve código 4 por "chain not
          # validated" aunque la firma sea correcta. Se comprueba el texto
          # "jar verified", que es lo que de verdad importa.
          VERIFY_OUT="$(jarsigner -verify -verbose:summary "$AAB_PATH" 2>&1 || true)"
          echo "$VERIFY_OUT" | tail -n 20

          if ! echo "$VERIFY_OUT" | grep -q "jar verified"; then
            echo "::error::El AAB no está firmado o la firma no es válida."
            exit 1
          fi

          mkdir -p release-artifacts

          OUTPUT_AAB="release-artifacts/Vivid-${GITHUB_RUN_NUMBER}-release.aab"
          cp "$AAB_PATH" "$OUTPUT_AAB"

          echo "aab_path=$OUTPUT_AAB" >> "$GITHUB_OUTPUT"
          ls -lh "$OUTPUT_AAB"

      - name: Upload signed release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: vivid-signed-release-aab-vc${{ github.run_number }}
          path: ${{ steps.aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      # mapping.txt hace falta para desofuscar crashes de Play / Firebase.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-vc${{ github.run_number }}
          path: vivid-app/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      # Cada build genera los esquemas de Room.
      - name: Check Room schemas
        shell: bash
        run: |
          if [ -d "vivid-app/app/schemas" ]; then
            echo "Esquemas de Room generados:"
            find vivid-app/app/schemas -name '*.json' | sort
          else
            echo "::warning::No se encontraron esquemas de Room en vivid-app/app/schemas"
          fi

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: vivid-app/app/schemas/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
