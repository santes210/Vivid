name: Deploy Firebase (Functions + Firestore Rules)

on:
  push:
    branches: [ main ]
    paths:
      - 'cloud-function/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cloud Function deps
        run: cd cloud-function && npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Auth with service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "${GOOGLE_APPLICATION_CREDENTIALS}"
          echo "Credentials written to ${GOOGLE_APPLICATION_CREDENTIALS}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json

      - name: Deploy Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          firebase deploy --only firestore:rules \
            --project verigram-c58a6 \
            --non-interactive \
            --debug 2>&1 | tee /tmp/debug-rules.log || true
          # Si falló, mostramos el log completo para diagnóstico
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== DEBUG LOG (últimas 80 líneas) ==="
            tail -80 /tmp/debug-rules.log
            exit 1
          fi

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          firebase deploy --only functions \
            --project verigram-c58a6 \
            --non-interactive \
            --force
